# Testa o projeto e compila o APK de depuração a cada push na branch main.
# O APK fica disponível em "Releases" e em Actions → execução → "Artifacts".
name: Testes e APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Vários envios seguidos: só o mais recente é compilado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes de regras de negócio e dados
        run: npm test
      - name: Testes do banco (PostgreSQL local)
        run: npm run test:db

  apk:
    needs: testes
    runs-on: ubuntu-24.04
    permissions:
      contents: write # necessário para publicar o APK em Releases
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web + sincronizar Android
        env:
          # Configure em Settings → Secrets and variables → Actions.
          # Apenas a URL e a chave PUBLICÁVEL; nunca a service_role.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run android:sync
      - name: Gerar ícones Android da marca oficial
        run: |
          python -m pip install --quiet pillow
          python scripts/gerar-icones-android.py
      - name: Compilar APK de depuração
        working-directory: android
        # chmod: arquivos enviados pelo Windows perdem a permissão de execução
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JogueAI-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jogueai-debug-apk
          path: JogueAI-build-${{ github.run_number }}.apk
          retention-days: 30
      # Publica o APK na página "Releases" (fácil de baixar pelo celular).
      - name: Publicar em Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JogueAI — build ${{ github.run_number }}
          make_latest: true
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
          files: JogueAI-build-${{ github.run_number }}.apk
